name = "schoolos-api"
main = "index.ts"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "https://schoolos-frontend.schoolos-aloysius.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "schoolos-db"
database_id = "1749e921-2ff4-48d3-83b1-9a33a83e8ce3" # local D1 identity; replace for production
migrations_dir = "."

# Secrets (never commit): 
#   local  -> workers/api/.dev.vars   with JWT_SECRET=<long random string>
#   prod   -> wrangler secret put JWT_SECRET
#
# Setup:
#   npx wrangler d1 create schoolos-db
#   npx wrangler d1 migrations apply schoolos-db --local
#   npx wrangler dev
